<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: cover: https:; connect-src 'self'; base-uri 'none'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Game Launcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-name">My Game Launcher</span>
          <span class="brand-note">本地游戏库</span>
        </div>

        <nav class="primary-nav" aria-label="主导航">
          <button class="nav-item active" data-view="library"><span>游戏库</span><span class="nav-count" id="allCount">0</span></button>
          <button class="nav-item" data-view="recent"><span>最近启动</span></button>
          <button class="nav-item" data-view="favorites"><span>收藏</span><span class="nav-count" id="favoriteCount">0</span></button>
        </nav>

        <div class="sidebar-group">
          <div class="sidebar-label">操作</div>
          <button class="side-action" id="sidebarImport">导入游戏</button>
          <button class="side-action" id="sidebarData">打开数据文件夹</button>
        </div>

        <div class="sidebar-footer">
          <button class="settings-button" id="settingsButton">设置</button>
          <span class="version" id="versionLabel">v0.1.0</span>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1 id="viewTitle">游戏库</h1>
          <div class="topbar-actions">
            <label class="search-box">
              <input id="searchInput" type="search" placeholder="搜索名称、分类或路径" autocomplete="off" />
              <span class="search-hint">/</span>
            </label>
            <button class="ghost-button" id="refreshButton">刷新</button>
          </div>
        </header>

        <section class="stats-bar" aria-label="游戏库统计">
          <div class="stat">
            <span class="stat-label">游戏数量</span>
            <span class="stat-value" id="totalMetric">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">累计时长</span>
            <span class="stat-value" id="timeMetric">0h</span>
          </div>
          <div class="stat">
            <span class="stat-label">最近游玩</span>
            <span class="stat-value" id="lastMetric">暂无</span>
          </div>
        </section>

        <section class="library-toolbar">
          <div class="toolbar-info">
            <h2 id="sectionTitle">全部游戏</h2>
            <span class="section-subtitle" id="sectionSubtitle">按最近添加排序</span>
          </div>
          <div class="toolbar-actions">
            <label class="sort-select">
              <span>排序</span>
              <select id="sortSelect">
                <option value="added">最近添加</option>
                <option value="played">最近启动</option>
                <option value="name">名称</option>
                <option value="time">游玩时长</option>
              </select>
            </label>
            <button class="primary-button" id="importButton">导入游戏</button>
          </div>
        </section>

        <section class="library-content" id="libraryContent"></section>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="modalBackdrop">
      <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
        <div class="modal-header">
          <h2 id="editModalTitle">导入游戏</h2>
          <button class="modal-close" data-close-modal aria-label="关闭">×</button>
        </div>
        <form id="gameForm">
          <div class="form-layout">
            <div class="cover-editor">
              <div class="cover-preview" id="coverPreview"><span class="cover-preview-empty">暂无封面</span></div>
              <button type="button" class="secondary-button full-width" id="findCoverButton">搜索封面</button>
              <button type="button" class="text-button full-width" id="localCoverButton">选择本地图片</button>
            </div>
            <div class="form-fields">
              <label class="field"><span>游戏名称</span><input id="nameInput" required maxlength="80" placeholder="例如：Hades" /></label>
              <label class="field">
                <span>启动文件</span>
                <span class="input-with-button">
                  <input id="exeInput" readonly required placeholder="选择 .exe 文件" />
                  <button type="button" class="field-button" id="browseExeButton">选择</button>
                </span>
              </label>
              <label class="field"><span>启动参数<em>可选</em></span><input id="argsInput" maxlength="500" placeholder="例如：-windowed -novid" /></label>
              <label class="field"><span>分类<em>可选</em></span><input id="categoryInput" maxlength="30" placeholder="例如：动作 / RPG" /></label>
              <p class="path-note">工作目录会自动使用游戏所在文件夹。</p>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="secondary-button" data-close-modal>取消</button>
            <button type="submit" class="primary-button">保存</button>
          </div>
        </form>
      </div>

      <div class="modal cover-modal hidden" id="coverModal" role="dialog" aria-modal="true" aria-labelledby="coverModalTitle">
        <div class="modal-header">
          <h2 id="coverModalTitle">选择封面</h2>
          <button class="modal-close" data-close-cover aria-label="关闭">×</button>
        </div>
        <div class="cover-search-row">
          <input id="coverSearchInput" placeholder="输入游戏名称" autocomplete="off" />
          <button class="secondary-button" id="coverSearchButton">搜索</button>
        </div>
        <div class="cover-results" id="coverResults"><div class="cover-results-empty">输入名称，从 Steam 搜索封面</div></div>
      </div>

      <div class="modal settings-modal hidden" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <div class="modal-header">
          <h2 id="settingsModalTitle">设置</h2>
          <button class="modal-close" data-close-settings aria-label="关闭">×</button>
        </div>
        <div class="settings-body">
          <section class="settings-section">
            <h3>外观</h3>
            <div class="theme-options">
              <button class="theme-option" data-theme-choice="dark">
                <span class="theme-swatch theme-swatch-dark"></span>
                <span class="theme-option-text"><strong>深色</strong><small>沉浸式深色界面</small></span>
              </button>
              <button class="theme-option" data-theme-choice="light">
                <span class="theme-swatch theme-swatch-light"></span>
                <span class="theme-option-text"><strong>浅色</strong><small>明亮清晰的界面</small></span>
              </button>
              <button class="theme-option" data-theme-choice="system">
                <span class="theme-swatch theme-swatch-system"></span>
                <span class="theme-option-text"><strong>跟随系统</strong><small>使用 Windows 的主题设置</small></span>
              </button>
            </div>
          </section>
          <section class="settings-section">
            <h3>游戏管理</h3>
            <div class="settings-actions">
              <button class="settings-action" data-settings-action="scan">
                <span class="settings-action-text"><strong>重新扫描游戏路径</strong><small>检查游戏文件是否仍然存在</small></span>
                <span class="settings-arrow">›</span>
              </button>
              <button class="settings-action" data-settings-action="remove-missing">
                <span class="settings-action-text"><strong>移除失效记录</strong><small>只移除文件已不存在的库记录</small></span>
                <span class="settings-arrow">›</span>
              </button>
            </div>
          </section>
          <section class="settings-section">
            <h3>数据与备份</h3>
            <div class="settings-actions">
              <button class="settings-action" data-settings-action="export">
                <span class="settings-action-text"><strong>导出游戏库</strong><small>保存游戏信息备份，不包含游戏文件</small></span>
                <span class="settings-arrow">›</span>
              </button>
              <button class="settings-action" data-settings-action="import">
                <span class="settings-action-text"><strong>导入游戏库</strong><small>从 JSON 备份恢复游戏记录</small></span>
                <span class="settings-arrow">›</span>
              </button>
              <button class="settings-action" data-settings-action="open-data">
                <span class="settings-action-text"><strong>打开数据文件夹</strong><small>查看游戏库与封面缓存</small></span>
                <span class="settings-arrow">›</span>
              </button>
            </div>
          </section>
        </div>
        <div class="modal-footer">
          <button type="button" class="primary-button" data-close-settings>完成</button>
        </div>
      </div>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <div class="context-menu hidden" id="gameContextMenu" role="menu">
      <button class="context-menu-item" data-context-action="remove" role="menuitem">移出游戏库</button>
      <button class="context-menu-item" data-context-action="edit" role="menuitem">编辑游戏</button>
      <button class="context-menu-item" data-context-action="reveal" role="menuitem">打开所在文件夹</button>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
